services:
  # ── Virtual Robot Container ──────────────────────────────────────────
  robot:
    image: ghcr.io/francescodelduchetto/cmp9134_2526_robotsim:latest
    environment:
      UVICORN_LOG_LEVEL: critical
    ports:
      - "5000:5000"
    networks:
      - app-network

  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_db
    command: ["postgres", "-c", "log_min_messages=PANIC", "-c", "log_connections=off", "-c", "log_disconnections=off"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/robot_db
      SECRET_KEY: super-secret-change-in-prod
      ROBOT_BASE_URL: http://robot:5000
      ROBOT_WS_URL: ws://robot:5000/ws/telemetry
    depends_on:
      postgres:
        condition: service_healthy
      robot:
        condition: service_started
    networks:
      - app-network

  # ── React Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
